server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Video streaming & scrubbing optimization (byte ranges)
    location ~* \.(mp4|webm|ogg)$ {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
    }

    # HLS Adaptive Streaming Playlists (.m3u8)
    location ~* \.m3u8$ {
        sendfile on;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.apple.mpegurl m3u8;
        }
    }

    # HLS Video Segments (.m4s, .ts) - Cached aggressively at edge
    location ~* \.(m4s|ts)$ {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
        types {
            video/iso.segment m4s;
            video/mp2t ts;
        }
    }

    # Static assets (images, fonts, scripts)
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Clean static HTML routing (no-cache for HTML so updates are instant)
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Block access to hidden files and sensitive paths (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom 404 page
    error_page 404 /_not-found.html;
}
